; A config file of its own. Run pytest FROM this directory (`cd smoke && pytest`)
; — the workflow uses `working-directory: smoke` for exactly this reason.
;
; Two things this buys us over inheriting the repo's pyproject.toml:
;   1. rootdir stops at `smoke/`, so pytest's confcutdir stops here and
;      `tests/conftest.py` is never imported — that conftest belongs to a
;      package rooted at the repo, and importing it prepends the repo root to
;      sys.path, shadowing the PyPI wheel with the in-tree source.
;   2. the repo's `addopts = -m 'not expensive'` doesn't leak in. Nothing here
;      is marked expensive, but a future marker change shouldn't be able to
;      silently deselect a production smoke test.
[pytest]
testpaths = .
; No -x: when the upload fails, the cascade of download failures is noise, but
; seeing *which* later steps also broke (manifest vs. bytes) is what tells you
; whether the registry is down or just the write path.
addopts = -ra --strict-markers

# Redis for prod Harbor: 1 master + 2 replicas, and 5 Sentinels at quorum 3.
# kubectl apply -n harbor -f this. The Harbor cutover that points clients at it
# already happened (overlay-redis-ha.yaml, 2026-10-22). Apply notes are the
# comments below. Do not follow the old cutover's failover drill during this apply.
#
# One apply sets Sentinel clusterSize and quorum together. The operator writes
# QUORUM into the pod env at start and does not rewrite a running Sentinel.
# Operator v0.23.0 (internal/k8sutils/statefulset.go generateStatefulSetsDef)
# never sets podManagementPolicy, and this file does not set
# kubernetesConfig.updateStrategy, so the StatefulSet keeps the API default
# OrderedReady. That field is immutable once set. Do not set Parallel.
# Kubernetes creates a missing higher ordinal and, under OrderedReady, returns
# before any destructive update. The rolling loop then deletes one old pod
# from the highest ordinal down, and only after that pod is healthy, so
# sentinel-3 and sentinel-4 come up at quorum 3 while sentinel-0..2 are still
# serving at quorum 2, and only then do 2, 1, and 0 get deleted. The live
# StatefulSet was not read for this note. Raising quorum while clusterSize is
# still 3 is the bad order: that rolls the only three before the new ones exist.
#
# With 5 Sentinels the majority is 3. Quorum 2 would let two declare the master
# down and take a third vote from a Sentinel that can still reach it. Quorum 3
# makes that gate match the majority.
#
# Hostname affinity leaves out k8s-v3-node4 (kernel 6.8.0-147 reboot-looped, and
# it is the node to cordon). A Sentinel asks for 64Mi, so node6-cache can hold
# one. Required pod anti-affinity stays, so the five pins are one pod per node.
# This file sets no toleration. A taint on one of those five hostnames,
# including node6-cache, leaves the new pod Pending. OrderedReady then stalls
# and the old three keep serving at quorum 2: stop. Do not add a toleration
# to force it on. Do not delete the Redis master during the apply. Every
# reconcile runs SENTINEL RESET. Diff the live RedisReplication against this
# file first so an apply does not revert drift on the data pods.
# check-redis-ha.sh does that check and does not apply.
#
# Why: the chart's internal Redis is a single StatefulSet pod on an RWO volume. On
# 2026-10-22 node4 went NotReady with harbor-redis-0 on it; the pod sat Terminating
# (a StatefulSet never replaces a pod it cannot confirm dead), every harbor-core
# crash-looped on "failed to initialize cache", and the registry served 502 until
# the pod was force-deleted and its VolumeAttachment removed by hand.
#
# Managed by the redis-operator already in the cluster (redis-operator-system,
# quay.io/opstree/redis-operator:v0.23.0). The separate RedisSentinel CR, not
# RedisReplication's embedded spec.sentinel: in v0.23.0 the embedded Sentinel pod
# template takes no affinity, so all three Sentinels could land on one node.
#
# Services the operator creates, and who uses which:
#   harbor-redis-ha-sentinel:26379        Harbor core, jobservice, registry, trivy
#                                         (redis+sentinel, master set myMaster)
#   harbor-redis-ha-master:6379           harbor-warmer, which speaks plain Redis.
#                                         The operator moves the role=master label
#                                         after a failover, so this follows it
#                                         with a reconcile of lag. README step 6
#                                         checks that it does.
#
# No password, same as the chart's internal Redis today. Both are ClusterIP only.
# Redis 7.2, the line Harbor ships (goharbor/redis-photon:v2.15.0 is 7.2.11). Not
# 7.0: a 7.2 DUMP payload does not RESTORE into 7.0, so the cutover key copy fails.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: harbor-redis-ha
  namespace: harbor
spec:
  clusterSize: 3
  # The opstree image runs Redis as uid 1000 and a fresh ceph-block volume is
  # root-owned, so without fsGroup Redis cannot create appendonlydir and exits
  # ("Permission denied"). Same values as the RedisCluster in hippius-s3-staging
  # and the operator's own e2e manifests.
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.2.16
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  # Required, not preferred: two copies on one node is the outage this file exists
  # to prevent. No nodeAffinity on this object. Adding one rolls the RWO data
  # pods, and check-redis-ha.sh forbids it. Cordon k8s-v3-node4 before the
  # Sentinel apply. A cordon does not evict the pods already running, and it is
  # what keeps a new data pod off node4. The 2026-10-22 audit named six workers
  # (k8s-v3-node1..5, node6-cache). This file does not assert that they are untainted.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: harbor-redis-ha
        topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    maxUnavailable: 1
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: ceph-block
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: harbor-redis-ha
  namespace: harbor
spec:
  clusterSize: 5
  # Sentinel rewrites /etc/redis/sentinel.conf as it runs. The operator's init
  # container writes that file into an emptyDir as root, so Sentinel (uid 1000)
  # exits with "sentinel.conf is not writable". Running the whole pod as 1000
  # makes the init container create it as the same user.
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.2.16
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
  # Required node list plus required pod anti-affinity: one Sentinel on each
  # named node, and none on node4. Do not add node4 here while it is still on
  # kernel 6.8.0-147. PDB stays maxUnavailable 1 only. Do not also set
  # minAvailable on this object.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - k8s-v3-node1
            - k8s-v3-node2
            - k8s-v3-node3
            - k8s-v3-node5
            - k8s-v3-node6-cache
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: harbor-redis-ha-sentinel
        topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    maxUnavailable: 1
  redisSentinelConfig:
    redisReplicationName: harbor-redis-ha
    masterGroupName: myMaster
    quorum: "3"
    # The operator defaults, written out so a failover's timing is readable here:
    # 5s to declare the master down, then up to 10s to promote a replica.
    downAfterMilliseconds: "5000"
    failoverTimeout: "10000"

# 0.8 blob census. Read-only: mounts the registry PVC with readOnly: true and
# only lists and sizes. Answers what 4 actually has to copy, which the Harbor
# database cannot: the DB knows 78,055 blobs / 2,060 GB, but the disk also
# carries blobs for repositories the DB has forgotten.
#
#   kubectl -n harbor apply -f deploy/harbor-s3-prod/blob-census-job.yaml
#   kubectl -n harbor logs -f job/harbor-blob-census
#
# A Job, not `kubectl run --rm -it`, because the walk takes a while on JuiceFS
# and must survive the terminal going away.
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-blob-census
  namespace: harbor
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 28800
  template:
    metadata:
      labels:
        app: harbor-blob-census
    spec:
      restartPolicy: OnFailure
      # Same node as the registry: its JuiceFS mount is already warm.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-v3-node1
      containers:
        - name: census
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              B=/storage/docker/registry/v2/blobs/sha256
              echo "counting blob directories (256 shards, cheap)..."
              n=0
              for d in "$B"/*/; do
                c=$(ls -1 "$d" 2>/dev/null | wc -l)
                n=$((n + c))
              done
              echo "blob digests on disk: $n"
              echo "  (Harbor's database knows 78055 - any excess is orphaned)"
              echo
              echo "sizing the tree (full walk, slower)..."
              kb=$(du -sk "$B" | awk '{print $1}')
              echo "blob bytes on disk: ${kb} KiB = $((kb / 1024 / 1024)) GiB"
              echo "  (Harbor's database totals 2060 GB of tracked blobs)"
          volumeMounts:
            - name: registry-data
              mountPath: /storage
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: harbor-registry
            readOnly: true

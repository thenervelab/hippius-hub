# Overlay for: helm upgrade harbor harbor/harbor --version 1.19.0 -n harbor --reuse-values -f this
# Do not apply until docs/plans/2026-08-25-harbor-s3-prod-runbook.md §0 is filled.
#
# Chart harbor-1.19.0 does not render s3.forcepathstyle, and it omits s3.secure
# when the value is false (distribution then defaults secure=true). Both are
# set via extraEnvVars. Do not "fix" that by bumping the chart.

persistence:
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      existingClaim: harbor-registry
      accessMode: ReadWriteMany
      size: 100Ti
      storageClass: hippius-juicefs
  imageChartStorage:
    disableredirect: true
    type: s3
    s3:
      existingSecret: harbor-s3
      region: us-east-1
      bucket: REPLACE_ME_BUCKET
      regionendpoint: http://gateway.hippius-s3-prod.svc.cluster.local:8080
      encrypt: false
      secure: false
      v4auth: true
      chunksize: "67108864"
      # Default 32 MiB. A 64–75 MiB pack then Move's via UploadPartCopy of
      # 32 MiB ranges (GET+PUT) instead of one CopyObject alias (~0.06s).
      # Required for unique 1 GiB ≥ 80 on hippius-s3 (harbor-staging
      # 2026-08-25). Chart 1.19.0 renders this.
      #
      # 5 GiB, not 128 MiB: the threshold has to clear the LARGEST blob we want
      # on the alias path, not just a pack. Live census 2026-08-26 (76,419
      # blobs): 622 are over 128 MiB, and 127 of those are over 4 GiB and carry
      # 33.7% of all bytes — every one would have stayed on UploadPartCopy.
      # 5 GiB is the ceiling, not a round number: S3 caps a single-operation
      # CopyObject there, so a larger value would make distribution attempt a
      # simple copy that S3 rejects. The 24 blobs above 5 GiB (largest 16.0 GiB)
      # necessarily keep using multipart copy — distribution falls back on its
      # own when size > threshold, so that is correct, just slower.
      multipartcopythresholdsize: "5368709120"
      # empty / omitted: keys are docker/registry/v2/blobs/sha256/<aa>/<digest>/data

registry:
  replicas: 1
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k8s-v3-node1
  registry:
    # BestEffort left the digest PUT CPU-starved under 16 concurrent 64 MiB
    # bodies on harbor-staging. Do not drop this at the flip.
    resources:
      requests:
        cpu: "2"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 4Gi
    extraEnvVars:
      - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE
        value: "true"
      - name: REGISTRY_STORAGE_S3_SECURE
        value: "false"
      - name: REGISTRY_STORAGE_S3_MULTIPARTCOPYTHRESHOLDSIZE
        value: "5368709120"
  controller:
    extraEnvVars:
      - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE
        value: "true"
      - name: REGISTRY_STORAGE_S3_SECURE
        value: "false"
      - name: REGISTRY_STORAGE_S3_MULTIPARTCOPYTHRESHOLDSIZE
        value: "5368709120"

core:
  # Sequential manifest PUT sat at ~1.5s on BestEffort. Keep 1 replica
  # (prod topology); CPU matches the harbor-staging unique-1GiB PASS.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

nginx:
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

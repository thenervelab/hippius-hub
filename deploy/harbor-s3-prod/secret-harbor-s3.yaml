# Fill keys, then: kubectl -n harbor apply -f this
# Do not commit real values. Bucket-scoped hip_ key only. Not the JuiceFS key.
apiVersion: v1
kind: Secret
metadata:
  name: harbor-s3
  namespace: harbor
type: Opaque
stringData:
  REGISTRY_STORAGE_S3_ACCESSKEY: REPLACE_ME_ACCESS_KEY
  REGISTRY_STORAGE_S3_SECRETKEY: REPLACE_ME_SECRET_KEY

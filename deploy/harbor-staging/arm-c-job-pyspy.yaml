# Diagnostic only. Namespace harbor-staging. Never namespace harbor.
# Profiles unique 1 GiB hub upload with py-spy. Needs SYS_PTRACE.
apiVersion: batch/v1
kind: Job
metadata:
  name: arm-c-bench-pyspy
  namespace: harbor-staging
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: python:3.12-slim-bookworm
          securityContext:
            capabilities:
              add: ["SYS_PTRACE"]
          env:
            - name: HARBOR_ENDPOINT
              value: http://harbor.harbor-staging.svc.cluster.local
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-staging-admin
                  key: HARBOR_ADMIN_PASSWORD
            - name: BENCH_SIZE_MIB
              value: "1024"
            - name: BENCH_RUNS
              value: "1"
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: script
              mountPath: /bench
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              pip install --no-cache-dir 'hippius_hub==0.7.0' httpx py-spy
              set +e
              py-spy record -o /data/profile.txt --format raw \
                --subprocesses --threads -- \
                python /bench/arm_c_bench.py
              spy_rc=$?
              set -e
              echo "py-spy exit $spy_rc"
              echo "===== py-spy collapsed stacks ====="
              sort /data/profile.txt | uniq -c | sort -nr | head -40
              sleep 90
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: script
          configMap:
            name: arm-c-bench
